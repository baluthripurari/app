# ============================================================
# serviceaccount.yaml
# WHY: A ServiceAccount is an identity for a Pod to interact
# with the Kubernetes API. Every pod gets one.
#
# BEST PRACTICE: Create a DEDICATED ServiceAccount per application.
# The "default" ServiceAccount in a namespace is shared by ALL pods
# that don't specify one — any permission given to it affects all pods.
#
# On EKS: ServiceAccounts can be annotated with an IAM Role (IRSA —
# IAM Roles for Service Accounts). This lets the Pod assume an AWS
# IAM role without storing credentials in environment variables.
# ============================================================

# The `if` block — only creates this resource if values.yaml has
# serviceAccount.create: true. Gives operators the choice to use
# a pre-existing SA instead (common in enterprise environments).
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Name generated by the helper — consistent with Deployment/Service naming
  name: {{ include "karaf-chart.serviceAccountName" . }}

  # Namespace: always use .Release.Namespace so helm install -n <ns> works
  namespace: {{ .Release.Namespace }}

  # Standard labels (from _helpers.tpl) — allows `kubectl get sa -l app=karaf`
  labels:
    {{- include "karaf-chart.labels" . | nindent 4 }}

  annotations:
    # Merge any user-provided annotations (e.g., IRSA IAM role ARN)
    # Example value in values.yaml:
    #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/KarafRole
    # This annotation tells EKS to inject AWS credentials into the pod
    # automatically using OIDC federation — NO static access keys needed.
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}

# automountServiceAccountToken: false
# WHY: By default K8s mounts the SA token (a JWT) into every pod at
# /var/run/secrets/kubernetes.io/serviceaccount/token
# If our app doesn't call the K8s API, this token is unnecessary.
# If an attacker exploits the app, they could use this token to call
# the K8s API. Disabling it removes that attack surface.
automountServiceAccountToken: false
{{- end }}